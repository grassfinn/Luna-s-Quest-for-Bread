<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Luna's Quest for Bread</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div id="debugger">
      <h1>mouse position</h1>
      <h2 id="debug-text"></h2>
    </div>
    <main id="game">
      <!-- Msg -->
      <p id="msg"></p>

      <!-- Canvas Layers -->
      <canvas id="items"></canvas>
      <canvas id="background"></canvas>
      <!-- Modals -->
      <dialog id="lock-modal">
        <h2>Unlock Bread?</h2>
        <section id="lock"></section>
        <form method="dialog">
          <button>Check</button>
        </form>
      </dialog>
      <!-- Settings -->
      <dialog id="settings">
        <span>X</span>
        <form id="settings-content">
          <div class="flex">
            <h2>Difficulty</h2>
            <select name="difficulty" id="difficulty">
              <option value="normal">Normal</option>
              <option value="dog">Dog</option>
            </select>
          </div>
          <div class="flex">
            <h2>Volume</h2>
            <input type="range" min="0" max="10" value="5" id="volume-slider" />
          </div>
          <ul>
            <h2>Instructions</h2>
            <li>Click on any items you find interactive</li>
            <li>
              Click on the bag that is on the middle paw to open/close your
              inventory
            </li>
            <li>
              To add/remove items to the puzzle click on any items when the
              puzzle interface is open
            </li>
          </ul>
          <!-- <h2>Credits</h2> -->
          <!-- <p>This game was created by HarpCodes</p> -->
        </form>
      </dialog>
      <dialog id="birthstones-modal">
        <span>X</span>
        <img src="./assets/images/birthstones.webp" width="500" alt="" />
      </dialog>
      <dialog id="win-screen">
        <img src="./assets/images/BREAD.gif" alt="win" />
      </dialog>
      <!-- Controls -->
      <section id="paw">
        <img src="./assets/images/pawUI/menu.svg" alt="" id="menu" />
        <img src="./assets/images/pawUI/hint 2.svg" alt="" id="hint" />
        <img id="inventory-btn" src="./assets/images/pawUI/bag.svg" alt="" />
        <img src="./assets/images/pawUI/left paw.svg" id="left-arrow" alt="" />
        <img
          src="./assets/images/pawUI/right paw.svg"
          id="right-arrow"
          alt=""
        />
      </section>
      <!-- Inventory -->
      <div id="inventory"></div>
      <!-- Bark Button -->
      <img src="./assets/images/pawUI/bark button.svg" alt="" id="bark" />
    </main>

    <script type="module" src="./app.js"></script>
  </body>
</html>
